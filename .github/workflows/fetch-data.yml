name: Refresh Live Data
on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分钟轻量刷新实时比分/状态/赔率（GitHub 调度可能延迟，非严格准点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh live matches (lightweight)
        run: |
          mkdir -p data
          python3 scripts/fetch_data.py --refresh
          echo "Live refresh completed"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh live data $(date +%Y-%m-%d_%H:%M)"
          # 与并发的全量任务可能冲突，rebase 后重试
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push conflict, retry $i in 5s"; sleep 5
          done
